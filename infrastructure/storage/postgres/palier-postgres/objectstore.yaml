# Backup target: Garage (S3-compatible) on the Hostinger VPS, reached over WireGuard.
# Plain HTTP is acceptable here: traffic stays inside the WireGuard tunnel.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-vps
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://palier-pg-backups/
    endpointURL: http://192.168.27.66:3900
    s3Credentials:
      accessKeyId:
        name: garage-backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: garage-backup-creds
        key: ACCESS_SECRET_KEY
      region:
        name: garage-backup-creds
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
      jobs: 2
  instanceSidecarConfiguration:
    env:
      # Recent boto3/AWS SDKs send checksum headers by default, which many
      # S3-compatible stores reject (plugin-barman-cloud issue #393).
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
