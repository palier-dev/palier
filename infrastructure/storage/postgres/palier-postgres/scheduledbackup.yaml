# Daily base backup at 03:00 (six-field cron: seconds first). WAL is archived continuously.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: palier-pg-daily
spec:
  cluster:
    name: palier-pg
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
