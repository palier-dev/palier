apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeseal
  namespace: argocd
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: sealed-secrets
    repoURL: https://bitnami.github.io/sealed-secrets
    targetRevision: 2.22.0
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
